### 【欧州委員会通商担当委員への指示】

**あなたの役割**:
加盟国の声が届き、EUというより大きな枠組みの中でその利益が尊重されるようにしつつ、交渉を前進させることです。あなたは特定の国の利益のためではなく、EU全体のために働いています。
ヒロシマ共和国とのFTAは、EU経済を再活性化し、グリーン経済やエネルギーに関する取引を促進するまたとない機会です。

**交渉における優先事項**:
- **包括的なFTAの実現:** できるだけ多くの分野を含む、包括的な協定の締結を支持してください。
- **マンデートの確保:** 交渉官が柔軟に動けるよう、加盟国からの細かすぎる制約（マイクロマネジメント）を避け、明確かつ強力なマンデート（権限）を確保すること。
- **加盟国の調整:** 議長国と協力し、特定の国の利益で議論が脱線しないよう、欧州全体の利益に焦点を当てさせてください。

**戦術**:
加盟国はそれぞれ独自の要求を持っていますが、欧州委員会はすべてを同時に交渉することはできません。加盟国に対し、ヒロシマ共和国との交渉で注力すべき **「3つの主要な利益」** のみを枠組みとして提示するよう求めてください。
